# Money Bot — Cloudflare Workers MCP (McpAgent)
# Current Agents templates prefer wrangler.jsonc; this TOML is equivalent
# and matches the requested scaffold layout.

name = "money-bot"
main = "src/index.ts"
compatibility_date = "2026-07-02"
compatibility_flags = ["nodejs_compat"]

# Payments plugin: do not persist invocation/request bodies to Workers Logs.
[observability]
enabled = false

[observability.logs]
invocation_logs = false

[observability.traces]
enabled = false

# Hard security: never auto-approve. Value is documented and ignored if raised.
# Secrets (APPROVAL_HMAC_SECRET, HOST_API_TOKEN, future Revolut wizard creds)
# MUST be set via `wrangler secret` / .dev.vars — never commit them here.
# HOST_API_TOKEN is required for POST /host/widget-decision (fail closed if unset).
# DEV_MODE does not exist: flipping a boolean must never enable Approve.
# ALLOW_TEST_AUTH must stay unset here. If it is set while ENVIRONMENT is
# production, the Worker refuses to serve (N-3). wrangler dev overrides
# ENVIRONMENT via .dev.vars (development) and may set ALLOW_TEST_AUTH there.
[vars]
AUTO_APPROVE_MAX = "0"
ENVIRONMENT = "production"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "MoneyBotMCP"

[[durable_objects.bindings]]
name = "SPEND_STORE"
class_name = "SpendStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MoneyBotMCP", "SpendStore"]
